matches:
  # Discrete Math Logic Symbols
  - trigger: ":not"
    replace: "¬"
  - trigger: ":and"
    replace: "∧"
  - trigger: ":or"
    replace: "∨"
  - trigger: ":xor"
    replace: "⊕"
  - trigger: ":imp"
    replace: "→"
  - trigger: ":bi"
    replace: "↔"
  - trigger: ":eq"
    replace: "≡"
  - trigger: ":th"
    replace: "∴"
